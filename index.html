<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Box</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="border-bottom">
    <div class="container-fluid header-row">
      <h1 class="h1 mb-0">Hex Box</h1>
      <div class="header-actions">
        <div class="dropdown">
          <button id="library-button" class="btn btn-primary" type="button" data-bs-toggle="dropdown" aria-expanded="false">Palette Library</button>
          <div class="dropdown-menu dropdown-menu-end saved-items-menu">
            <h2 class="h6 px-2 pt-1">Palette Library</h2>
            <div id="saved-palettes"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-fluid">
    <div class="app-layout">
      <aside id="app-sidebar" class="sidebar-column" aria-label="Controls">
        <section class="card controls-card" aria-labelledby="controls-title">
          <div class="area-heading">
            <h2 id="controls-title" class="h3">Controls</h2>
          </div>
          <div class="control-groups">
            <section class="control-group">
              <div class="control-label"><span>Hex</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-hex-mode="3">#3</button><button class="btn btn-outline-secondary" data-hex-mode="6">#6</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Value</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-helper="shade">Shade</button><button class="btn btn-outline-secondary" data-helper="tint">Tint</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Chroma</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-helper="chroma-down">Mute</button><button class="btn btn-outline-secondary" data-helper="chroma-up">Vivid</button></div>
            </section>
          </div>
        </section>
      </aside>

      <div class="workspace-grid">
        <section class="card builder-card workspace-card" aria-labelledby="swatch-builder-title">
          <div class="area-heading">
            <h2 id="swatch-builder-title" class="h3">Set</h2>
            <div class="heading-actions">
              <input id="set-name" class="form-control" placeholder="Set name" aria-label="Set name">
              <button id="save-set" class="btn btn-success" type="button">Save to Palette</button>
              <button id="clear-set" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>

          <div class="set-row-section attributes-row">
            <h3 class="set-row-title">Stats</h3>
            <div id="set-column-labels" class="set-column-labels" aria-hidden="true"></div>
            <div id="set-metrics" class="set-metrics" aria-label="Swatch attributes"></div>
          </div>
          <div class="set-row-section preview-row">
            <h3 class="set-row-title">Preview</h3>
            <div id="set-arrows-up" class="set-arrow-controls set-arrows-up" aria-label="Increase swatch digits"></div>
            <div id="set-builder" class="set-slots" aria-label="Set swatches"></div>
            <div id="set-arrows-down" class="set-arrow-controls set-arrows-down" aria-label="Decrease swatch digits"></div>
          </div>
          <div class="set-row-section comparisons-row">
            <h3 class="set-row-title">Comp</h3>
            <div id="set-differences" class="set-differences" aria-label="Differences between adjacent swatches" aria-live="polite"></div>
            <div id="comparison-labels" class="comparison-labels" aria-hidden="true"></div>
          </div>
        </section>

        <section class="card standby-card workspace-card" aria-labelledby="standby-title">
          <div class="area-heading">
            <h2 id="standby-title" class="h3">Staging</h2>
            <div class="heading-actions">
              <button id="compress-standby" class="btn btn-primary" type="button">Compress</button>
              <button id="delete-swatch" class="btn btn-danger" type="button" disabled>Delete</button>
              <button id="clear-standby" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>
          <div id="standby-grid" class="swatch-slots" aria-label="Swatch Tray"></div>
        </section>

        <section id="palette-drawer" class="card palette-builder-card workspace-card" aria-labelledby="palette-builder-title">
          <div class="area-heading">
            <h2 id="palette-builder-title" class="h3">Palette</h2>
            <div class="heading-actions">
              <input id="palette-name" class="form-control" placeholder="Palette name" aria-label="Palette name">
              <button id="save-palette" class="btn btn-success" type="button">Save to Library</button>
              <button id="clear-palette" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>
          <div id="palette-builder" class="palette-sets" aria-label="Palette sets"></div>
        </section>
      </div>
    </div>
  </main>
  <button id="palette-toggle" class="btn btn-primary h3 drawer-toggle palette-toggle" type="button" aria-controls="palette-drawer" aria-expanded="false" aria-label="Open palette staging">‹</button>

  <div id="warning-modal" class="modal fade" tabindex="-1" aria-labelledby="warning-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 id="warning-title" class="h3 modal-title">Cannot complete action</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="warning-message" class="mb-0"></p></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">OK</button></div>
    </div></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
