<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Box</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="border-bottom">
    <div class="container-fluid header-row">
      <h1 class="h1 mb-0">Hex Box</h1>
      <div class="header-actions">
        <div class="dropdown">
          <button id="library-button" class="btn btn-primary" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Open palette library">Library</button>
          <div class="dropdown-menu dropdown-menu-end saved-items-menu">
            <div id="saved-palettes"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-fluid">
    <div class="app-layout">
      <aside id="app-sidebar" class="sidebar-column" aria-label="Controls">
        <section class="card controls-card" aria-labelledby="controls-title">
          <div class="area-heading">
            <h2 id="controls-title" class="h3">Controls</h2>
          </div>
          <div class="control-groups">
            <section class="control-group">
              <div class="control-label"><span>Temp</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-helper="cooler">Cooler</button><button class="btn btn-outline-secondary" data-helper="warmer">Warmer</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Value</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-helper="shade">Shade</button><button class="btn btn-outline-secondary" data-helper="tint">Tint</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Chroma</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-helper="chroma-down">Mute</button><button class="btn btn-outline-secondary" data-helper="chroma-up">Vivid</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Hex</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-hex-mode="3">#3</button><button class="btn btn-outline-secondary" data-hex-mode="6">#6</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Swatches</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-set-size="3">3</button><button class="btn btn-outline-secondary" data-set-size="5">5</button></div>
            </section>
            <section class="control-group">
              <div class="control-label"><span>Display</span></div>
              <div class="btn-group"><button class="btn btn-outline-secondary" data-display-row="stats" aria-label="Toggle Stats row">Stats</button><button class="btn btn-outline-secondary" data-display-row="comp" aria-label="Toggle Comp row">Comp</button></div>
            </section>
          </div>
        </section>
      </aside>

      <div class="workspace-grid">
        <section class="card builder-card workspace-card" aria-labelledby="staging-title">
          <div class="area-heading">
            <h2 id="staging-title" class="h3">Staging</h2>
            <div class="heading-actions">
              <button id="save-scheme" class="btn btn-success" type="button">Save to Palette</button>
              <button id="clear-scheme" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>

          <div class="set-row-section attributes-row">
            <h3 class="set-row-title">Stats</h3>
            <div id="scheme-column-labels" class="set-column-labels" aria-hidden="true"></div>
            <div id="scheme-metrics" class="set-metrics" aria-label="Scheme swatch attributes"></div>
          </div>
          <div class="set-row-section preview-row">
            <h3 class="set-row-title">Preview</h3>
            <div id="scheme-arrows-up" class="set-arrow-controls set-arrows-up" aria-label="Increase scheme swatch digits"></div>
            <div id="scheme-swatches" class="set-slots" aria-label="Editable scheme swatches"></div>
            <div id="scheme-arrows-down" class="set-arrow-controls set-arrows-down" aria-label="Decrease scheme swatch digits"></div>
          </div>
          <div class="set-row-section comparisons-row">
            <h3 class="set-row-title">Comp</h3>
            <div id="scheme-differences" class="set-differences" aria-label="Hex digit differences between adjacent scheme swatches" aria-live="polite"></div>
            <div id="comparison-labels" class="comparison-labels" aria-hidden="true"></div>
          </div>
        </section>

        <section class="card standby-card workspace-card" aria-labelledby="standby-title">
          <div class="area-heading">
            <h2 id="standby-title" class="h3">Standby</h2>
            <div class="heading-actions">
              <button id="compress-standby" class="btn btn-primary" type="button">Compress</button>
              <button id="clear-standby" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>
          <div id="standby-grid" class="swatch-slots standby-slots" aria-label="Standby swatches"></div>
        </section>

        <section id="palette-drawer" class="card palette-builder-card workspace-card" aria-labelledby="palette-title">
          <div class="area-heading">
            <h2 id="palette-title" class="h3">Palette</h2>
            <div class="heading-actions">
              <button id="save-palette" class="btn btn-success" type="button">Save to Library</button>
              <button id="clear-palette" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>
          <div id="palette-schemes" class="palette-sets" aria-label="Palette schemes"></div>
        </section>
      </div>
    </div>
  </main>
  <button id="palette-toggle" class="btn btn-primary h3 drawer-toggle palette-toggle" type="button" aria-controls="palette-drawer" aria-expanded="false" aria-label="Open palette">‹</button>

  <div id="name-modal" class="modal fade" tabindex="-1" aria-labelledby="name-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="name-form">
        <div class="modal-body name-modal-body">
          <label id="name-modal-title" class="h3" for="name-input">Name</label>
          <input id="name-input" class="form-control" required autocomplete="off" aria-required="true">
          <div class="name-modal-actions"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" type="submit">Save</button></div>
          <div id="name-conflict" class="name-conflict" hidden>
            <strong id="name-conflict-title"></strong>
            <span id="name-conflict-message"></span>
            <div class="name-conflict-actions"><button class="btn btn-primary" type="button" data-name-conflict-action="rename">Rename</button><button class="btn btn-danger" type="button" data-name-conflict-action="replace">Replace</button></div>
          </div>
        </div>
      </form>
    </div></div>
  </div>

  <div id="warning-modal" class="modal fade" tabindex="-1" aria-labelledby="warning-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 id="warning-title" class="h3 modal-title">Cannot complete action</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="warning-message" class="mb-0"></p></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">OK</button></div>
    </div></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
